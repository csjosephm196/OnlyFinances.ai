services:
  - type: web
    name: demo-backend-bqyy
    runtime: python
    region: Virginia
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173
      - key: DEBUG
        value: false
